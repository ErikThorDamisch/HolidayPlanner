<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday Planner — Sign In</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#201e1d">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holidays">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --color-bg:         #f3f2f2;
  --color-ink:        #201e1d;
  --color-muted:      #605d5d;
  --color-placeholder:#9b9797;
  --color-rule:       #d7d3d3;
  --color-accent:     #ec3013;
  --color-accent-deep:#ae1800;
  --color-green:      #164A3C;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Archivo', system-ui, sans-serif;
  background: var(--color-rule);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  color: var(--color-ink);
}
button, input { font-family: inherit; color: inherit; }
.mono { font-family: 'IBM Plex Mono', monospace; }

.card {
  width: 100%; max-width: 420px;
  background: var(--color-ink);
  box-shadow: 0 24px 60px rgba(23,24,28,.24);
  display: flex; flex-direction: column;
}

.brand {
  padding: 28px 32px;
  border-bottom: 2px solid var(--color-bg);
  display: flex; align-items: center; gap: 11px;
}
.brand-mark { width: 20px; height: 20px; background: var(--color-accent); flex-shrink: 0; }
.brand-name { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--color-bg); }

.hero { padding: 28px 32px 8px; }
.hero-title {
  font-size: 30px; font-weight: 700; letter-spacing: -.035em; line-height: 1.08;
  color: var(--color-bg); margin-bottom: 8px;
}
.hero-sub { font-size: 13px; color: rgba(243,242,242,.6); line-height: 1.55; max-width: 320px; }

.panel { background: var(--color-bg); padding: 26px 32px 30px; margin-top: 24px; }

.tabs { display: flex; gap: 22px; border-bottom: 2px solid var(--color-ink); margin-bottom: 20px; }
.tab {
  font-size: 12px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: var(--color-muted); padding-bottom: 8px; cursor: pointer;
  background: none; border: none; font-family: inherit;
}
.tab.active { color: var(--color-ink); font-weight: 700; box-shadow: inset 0 -3px 0 var(--color-accent); }

.msg {
  padding: 10px 12px; border: 1.5px solid var(--color-accent);
  font-size: 12.5px; margin-bottom: 16px; display: none; font-weight: 500;
  color: var(--color-accent-deep);
}
.msg.error   { display: block; }
.msg.success { display: block; border-color: var(--color-green); color: var(--color-green); }

.field { margin-bottom: 14px; }
.field label {
  display: block; font-size: 10px; font-weight: 700; letter-spacing: .14em;
  text-transform: uppercase; color: var(--color-muted); margin-bottom: 6px;
}
.field input {
  width: 100%; padding: 10px 12px; border: 1.5px solid var(--color-rule);
  font-size: 14px; color: var(--color-ink); background: transparent; outline: none;
}
.field input:focus { border-color: var(--color-ink); }
.field input[type="password"] { font-family: 'IBM Plex Mono', monospace; }

.submit-btn {
  width: 100%; padding: 12px; margin-top: 6px;
  background: var(--color-green); color: var(--color-bg); border: none;
  font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  cursor: pointer;
}
.submit-btn:hover  { background: #0f382d; }
.submit-btn:disabled { background: var(--color-rule); color: var(--color-muted); cursor: not-allowed; }

.hint { font-size: 12px; color: var(--color-muted); text-align: center; margin-top: 16px; line-height: 1.5; }
.hint strong { color: var(--color-ink); }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark"></div>
    <div class="brand-name">Holiday Planner</div>
  </div>

  <div class="hero">
    <div class="hero-title">A year of days off,<br>on one page.</div>
    <div class="hero-sub">Plan, count and export your time off. Zürich and Hamburg holidays built in.</div>
  </div>

  <div class="panel">
    <div class="tabs">
      <button class="tab active" id="tabLogin"    onclick="show('login')">Sign in</button>
      <button class="tab"        id="tabRegister" onclick="show('register')">Create account</button>
    </div>

    <div class="msg" id="msg"></div>

    <!-- Login -->
    <div id="fLogin">
      <div class="field">
        <label>Username</label>
        <input type="text" id="lUser" placeholder="Your username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="lPass" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="submit-btn" id="btnLogin" onclick="doLogin()">Sign in</button>
      <div class="hint">No account? Click <strong>Create account</strong> above.</div>
    </div>

    <!-- Register -->
    <div id="fRegister" style="display:none">
      <div class="field">
        <label>Username</label>
        <input type="text" id="rUser" placeholder="Choose a username (min. 3 chars)" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="rPass" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm password</label>
        <input type="password" id="rConf" placeholder="Repeat your password" autocomplete="new-password">
      </div>
      <button class="submit-btn" id="btnReg" onclick="doRegister()">Create account</button>
      <div class="hint">Already have an account? Click <strong>Sign in</strong> above.</div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
<script>
// If already logged in, go to app
const tok = localStorage.getItem('shp_token');
if (tok) {
  fetch('/api/auth/me', { headers:{ 'Authorization':'Bearer '+tok } })
    .then(r=>{ if(r.ok) location.href='/'; })
    .catch(()=>{});
}

function show(tab) {
  const isL = tab==='login';
  document.getElementById('tabLogin').className    = 'tab'+(isL?' active':'');
  document.getElementById('tabRegister').className = 'tab'+(!isL?' active':'');
  document.getElementById('fLogin').style.display    = isL ? 'block' : 'none';
  document.getElementById('fRegister').style.display = !isL ? 'block' : 'none';
  clearMsg();
}

function showMsg(txt,type){ const e=document.getElementById('msg'); e.textContent=txt; e.className='msg '+type; }
function clearMsg(){ document.getElementById('msg').className='msg'; }

function setBusy(id,busy,txt,busyTxt){
  const b=document.getElementById(id); b.disabled=busy; b.textContent=busy?busyTxt:txt;
}

async function doLogin(){
  clearMsg();
  const username=document.getElementById('lUser').value.trim();
  const password=document.getElementById('lPass').value;
  if(!username||!password){ showMsg('Please enter your username and password.','error'); return; }
  setBusy('btnLogin',true,'Sign in','Signing in…');
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){ showMsg(data.error||'Login failed.','error'); return; }
    localStorage.setItem('shp_token',data.token);
    localStorage.setItem('shp_username',data.username);
    location.href='/';
  } catch(e){ showMsg('Could not reach the server.','error'); }
  finally{ setBusy('btnLogin',false,'Sign in','Signing in…'); }
}

async function doRegister(){
  clearMsg();
  const username=document.getElementById('rUser').value.trim();
  const password=document.getElementById('rPass').value;
  const confirm =document.getElementById('rConf').value;
  if(!username||!password){ showMsg('Please fill in all fields.','error'); return; }
  if(password!==confirm){ showMsg('Passwords do not match.','error'); return; }
  setBusy('btnReg',true,'Create account','Creating account…');
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){ showMsg(data.error||'Registration failed.','error'); return; }
    localStorage.setItem('shp_token',data.token);
    localStorage.setItem('shp_username',data.username);
    location.href='/';
  } catch(e){ showMsg('Could not reach the server.','error'); }
  finally{ setBusy('btnReg',false,'Create account','Creating account…'); }
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const isLogin=document.getElementById('fLogin').style.display!=='none';
  if(isLogin) doLogin(); else doRegister();
});
</script>
</body>
</html>
