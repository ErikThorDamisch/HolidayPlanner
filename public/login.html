<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Holiday Planner — Sign In</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0E1A">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Holidays">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink:     #0A0E1A;
  --muted:   #64748B;
  --bg:      #ECEEF8;
  --surface: #FFFFFF;
  --border:  #DDE0F0;
  --accent:  #5C6BC0;
  --red:     #E84040;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: var(--ink);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  /* Subtle dot grid */
  background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size: 28px 28px;
  background-color: var(--ink);
}

.card {
  width: 100%;
  max-width: 400px;
  background: var(--surface);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 32px 80px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
}

/* Brand */
.brand {
  padding: 32px 32px 26px;
  text-align: center;
}

.brand-mark {
  width: 52px; height: 52px;
  background: var(--accent);
  border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center;
  margin-bottom: 16px;
  box-shadow: 0 8px 24px rgba(92,107,192,.45);
}
.brand-mark svg { width: 26px; height: 26px; fill: #fff; }

.brand-name {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.03em;
  color: var(--ink);
}

.brand-sub {
  font-size: 13px;
  color: var(--muted);
  margin-top: 4px;
}

/* Tabs */
.tabs {
  display: flex;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
}

.tab {
  flex: 1; padding: 13px;
  text-align: center;
  font-size: 13.5px; font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all .15s;
  user-select: none;
  background: transparent;
  border-top: none; border-left: none; border-right: none;
  font-family: inherit;
}

.tab.active {
  color: var(--ink);
  font-weight: 700;
  border-bottom-color: var(--accent);
  background: var(--surface);
}

/* Form */
.form-body { padding: 26px 28px 30px; }

.msg {
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  display: none;
  font-weight: 500;
}
.msg.error   { background: #FDEAEA; color: var(--red); border: 1px solid #fca5a5; display: block; }
.msg.success { background: #E8FAF3; color: #1e7d55; border: 1px solid #86efac; display: block; }

.field { margin-bottom: 14px; }

.field label {
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 6px;
}

.field input {
  width: 100%;
  padding: 11px 13px;
  border: 1.5px solid var(--border);
  border-radius: 9px;
  font-family: inherit;
  font-size: 14.5px;
  color: var(--ink);
  background: var(--bg);
  outline: none;
  transition: border-color .15s, background .15s;
}
.field input:focus { border-color: var(--accent); background: var(--surface); }

.submit-btn {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: 9px;
  font-family: inherit;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: -.01em;
  cursor: pointer;
  transition: background .15s, transform .1s;
  box-shadow: 0 4px 14px rgba(92,107,192,.4);
}
.submit-btn:hover  { background: #4a5aad; }
.submit-btn:active { transform: scale(.99); }
.submit-btn:disabled { background: #C5C9E0; box-shadow: none; cursor: not-allowed; }

.hint {
  font-size: 12px;
  color: var(--muted);
  text-align: center;
  margin-top: 16px;
  line-height: 1.5;
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 20 20"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 2a6 6 0 110 12A6 6 0 0110 4zm0 1a1 1 0 00-1 1v4.586l-2.707 2.707a1 1 0 101.414 1.414L10 12.414V6a1 1 0 00-1-1z" fill-rule="evenodd" clip-rule="evenodd"/></svg>
    </div>
    <div class="brand-name">Holiday Planner</div>
    <div class="brand-sub">Plan your days off, your way</div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabLogin"    onclick="show('login')">Sign In</button>
    <button class="tab"        id="tabRegister" onclick="show('register')">Create Account</button>
  </div>

  <div class="form-body">
    <div class="msg" id="msg"></div>

    <!-- Login -->
    <div id="fLogin">
      <div class="field">
        <label>Username</label>
        <input type="text" id="lUser" placeholder="Your username" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="lPass" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="submit-btn" id="btnLogin" onclick="doLogin()">Sign In</button>
      <div class="hint">No account? Click <strong>Create Account</strong> above.</div>
    </div>

    <!-- Register -->
    <div id="fRegister" style="display:none">
      <div class="field">
        <label>Username</label>
        <input type="text" id="rUser" placeholder="Choose a username (min. 3 chars)" autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="rPass" placeholder="At least 6 characters" autocomplete="new-password">
      </div>
      <div class="field">
        <label>Confirm Password</label>
        <input type="password" id="rConf" placeholder="Repeat your password" autocomplete="new-password">
      </div>
      <button class="submit-btn" id="btnReg" onclick="doRegister()">Create Account</button>
      <div class="hint">Already have an account? Click <strong>Sign In</strong> above.</div>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
}
</script>
<script>
// If already logged in, go to app
const tok = localStorage.getItem('shp_token');
if (tok) {
  fetch('/api/auth/me', { headers:{ 'Authorization':'Bearer '+tok } })
    .then(r=>{ if(r.ok) location.href='/'; })
    .catch(()=>{});
}

function show(tab) {
  const isL = tab==='login';
  document.getElementById('tabLogin').className    = 'tab'+(isL?' active':'');
  document.getElementById('tabRegister').className = 'tab'+(!isL?' active':'');
  document.getElementById('fLogin').style.display    = isL ? 'block' : 'none';
  document.getElementById('fRegister').style.display = !isL ? 'block' : 'none';
  clearMsg();
}

function showMsg(txt,type){ const e=document.getElementById('msg'); e.textContent=txt; e.className='msg '+type; }
function clearMsg(){ document.getElementById('msg').className='msg'; }

function setBusy(id,busy,txt,busyTxt){
  const b=document.getElementById(id); b.disabled=busy; b.textContent=busy?busyTxt:txt;
}

async function doLogin(){
  clearMsg();
  const username=document.getElementById('lUser').value.trim();
  const password=document.getElementById('lPass').value;
  if(!username||!password){ showMsg('Please enter your username and password.','error'); return; }
  setBusy('btnLogin',true,'Sign In','Signing in…');
  try{
    const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){ showMsg(data.error||'Login failed.','error'); return; }
    localStorage.setItem('shp_token',data.token);
    localStorage.setItem('shp_username',data.username);
    location.href='/';
  } catch(e){ showMsg('Could not reach the server.','error'); }
  finally{ setBusy('btnLogin',false,'Sign In','Signing in…'); }
}

async function doRegister(){
  clearMsg();
  const username=document.getElementById('rUser').value.trim();
  const password=document.getElementById('rPass').value;
  const confirm =document.getElementById('rConf').value;
  if(!username||!password){ showMsg('Please fill in all fields.','error'); return; }
  if(password!==confirm){ showMsg('Passwords do not match.','error'); return; }
  setBusy('btnReg',true,'Create Account','Creating account…');
  try{
    const r=await fetch('/api/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const data=await r.json();
    if(!r.ok){ showMsg(data.error||'Registration failed.','error'); return; }
    localStorage.setItem('shp_token',data.token);
    localStorage.setItem('shp_username',data.username);
    location.href='/';
  } catch(e){ showMsg('Could not reach the server.','error'); }
  finally{ setBusy('btnReg',false,'Create Account','Creating account…'); }
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const isLogin=document.getElementById('fLogin').style.display!=='none';
  if(isLogin) doLogin(); else doRegister();
});
</script>
</body>
</html>
